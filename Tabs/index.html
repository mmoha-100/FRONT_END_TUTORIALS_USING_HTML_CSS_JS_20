<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Tabs</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <ul class="tabs">
            <li class="active">One</li>
            <li>Two</li>
            <li>Three</li>
        </ul>
        <div class="container">
            <div class="one">Content 1</div>
            <div class="two v-hidden">Content 2</div>
            <div class="three v-hidden">Content 3</div>
        </div>
        <script src="main.js"></script>
    </body>
</html>
